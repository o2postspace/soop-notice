<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>관리자</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
  h1 { font-size: 20px; color: #5B6AED; margin-bottom: 16px; }
  h2 { font-size: 16px; color: #333; margin: 20px 0 12px; }
  .login { max-width: 300px; margin: 100px auto; text-align: center; }
  .login input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
  .login button { width: 100%; padding: 10px; background: #5B6AED; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .admin { max-width: 900px; margin: 0 auto; display: none; }
  .tabs { display: flex; gap: 0; margin-bottom: 16px; overflow-x: auto; }
  .tab { padding: 10px 24px; border: none; background: #eee; color: #666; cursor: pointer; font-size: 14px; font-weight: 600; }
  .tab.active { background: #5B6AED; color: #fff; }
  .tab:first-child { border-radius: 6px 0 0 6px; }
  .tab:last-child { border-radius: 0 6px 6px 0; }
  .panel { display: none; }
  .panel.active { display: block; }
  .item { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; align-items: flex-start; gap: 12px; }
  .item-content { flex: 1; }
  .item-subject { font-weight: 700; font-size: 14px; color: #333; }
  .item-body { font-size: 12px; color: #666; margin-top: 4px; white-space: pre-wrap; }
  .item-meta { font-size: 11px; color: #aaa; margin-top: 4px; }
  .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-sm { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; }
  .btn-del { background: #ff4757; color: #fff; }
  .btn-edit { background: #5B6AED; color: #fff; }
  .btn-hide { background: #f2a93b; color: #fff; }
  .btn-restore { background: #33a06f; color: #fff; }
  .empty { text-align: center; color: #bbb; padding: 30px; }
  .add-form { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .add-form input, .add-form select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; margin-right: 6px; margin-bottom: 6px; }
  .add-form button { padding: 6px 16px; background: #5B6AED; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .community-report-filter { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .community-report-filter select { padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px; background: #fff; }
  @media (max-width: 700px) {
    body { padding: 10px; }
    .tab { padding: 9px 13px; white-space: nowrap; }
    .item { flex-direction: column; }
    .item-actions { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="login" id="loginBox">
  <h1>관리자 로그인</h1>
  <input type="password" id="keyInput" placeholder="비밀키 입력" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">확인</button>
</div>

<div class="admin" id="adminBox">
  <h1>관리자 페이지</h1>
  <div class="tabs">
    <button class="tab active" onclick="showPanel('feedback')">건의사항</button>
    <button class="tab" onclick="showPanel('community')">커뮤니티 신고</button>
    <button class="tab" onclick="showPanel('schedules')">캘린더 관리</button>
    <button class="tab" onclick="showPanel('updates')">업데이트 관리</button>
  </div>

  <div class="panel active" id="panel-feedback">
    <div id="feedbackList"></div>
  </div>

  <div class="panel" id="panel-community">
    <div class="community-report-filter">
      <select id="communityReportStatus" onchange="loadCommunityReports()">
        <option value="pending">처리 대기</option>
        <option value="resolved">처리 완료</option>
        <option value="dismissed">기각</option>
      </select>
      <button class="btn-sm btn-edit" onclick="loadCommunityReports()">새로고침</button>
    </div>
    <div id="communityReportList"></div>
  </div>

  <div class="panel" id="panel-updates">
    <h2>업데이트 작성</h2>
    <div class="add-form">
      <select id="updateCategory">
        <option value="업데이트">업데이트</option>
        <option value="건의수용">건의수용</option>
        <option value="버그수정">버그수정</option>
        <option value="공지">공지</option>
      </select>
      <input id="updateTitle" placeholder="제목" style="width:250px;">
      <br>
      <textarea id="updateContent" placeholder="내용" style="width:100%;height:100px;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px;margin:6px 0;resize:vertical;"></textarea>
      <button onclick="addUpdate()">작성</button>
    </div>
    <h2>작성 목록</h2>
    <div id="updateList"></div>
  </div>

  <div class="panel" id="panel-schedules">
    <h2>일정 추가</h2>
    <div class="add-form">
      <input id="addBj" placeholder="스트리머 이름" style="width:120px;">
      <input id="addDate" type="date">
      <input id="addTime" type="time">
      <input id="addDesc" placeholder="설명" style="width:200px;">
      <button onclick="addSchedule()">추가</button>
    </div>
    <h2>최근 일정</h2>
    <div id="scheduleList"></div>
  </div>
</div>

<script>
const API_BASE = "https://api.soopnotice.com";
let adminKey = '';

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function safeId(value) {
  const number = Number(value);
  return Number.isSafeInteger(number) && number > 0 ? number : null;
}

async function adminFetch(path, options) {
  const request = Object.assign({ method: 'GET', cache: 'no-store' }, options || {});
  request.headers = Object.assign({ 'Accept': 'application/json', 'X-Admin-Key': adminKey }, request.headers || {});
  if (request.body && typeof request.body !== 'string') {
    request.headers['Content-Type'] = 'application/json';
    request.body = JSON.stringify(request.body);
  }
  const response = await fetch(API_BASE + path, request);
  let data = null;
  try { data = await response.json(); } catch (error) {}
  if (!response.ok) throw new Error(data && data.error ? data.error : '요청 실패 (' + response.status + ')');
  return data;
}

function showPanel(name) {
  const tabs = document.querySelectorAll('.tab');
  const names = ['feedback', 'community', 'schedules', 'updates'];
  tabs.forEach((t, i) => t.classList.toggle('active', names[i] === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'community') loadCommunityReports();
  if (name === 'schedules') loadSchedules();
  if (name === 'updates') loadUpdateList();
}

async function login() {
  adminKey = document.getElementById('keyInput').value;
  try {
    const data = await adminFetch('/api/feedback');
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('adminBox').style.display = 'block';
    renderFeedback(data);
  } catch(e) { alert('오류: ' + e.message); }
}

function renderFeedback(data) {
  if (data.length === 0) {
    document.getElementById('feedbackList').innerHTML = '<div class="empty">건의사항이 없습니다</div>';
    return;
  }
  document.getElementById('feedbackList').innerHTML = data.map(d =>
    '<div class="item"><div class="item-content"><div class="item-subject">' + esc(d.subject) + '</div><div class="item-body">' + esc(d.body) + '</div><div class="item-meta">' + new Date(d.created_at).toLocaleString('ko-KR') + '</div></div></div>'
  ).join('');
}

async function loadSchedules() {
  const data = await adminFetch('/api/admin/schedules');
  if (!data.length) {
    document.getElementById('scheduleList').innerHTML = '<div class="empty">일정이 없습니다</div>';
    return;
  }
  document.getElementById('scheduleList').innerHTML = data.map(d => {
    const t = new Date(new Date(d.broadcast_start).getTime() + 9*60*60*1000);
    const timeStr = t.getUTCFullYear() + '-' + String(t.getUTCMonth()+1).padStart(2,'0') + '-' + String(t.getUTCDate()).padStart(2,'0') + ' ' + String(t.getUTCHours()).padStart(2,'0') + ':' + String(t.getUTCMinutes()).padStart(2,'0');
    return '<div class="item"><div class="item-content"><div class="item-subject">' + esc(d.bj_name) + ' — ' + timeStr + '</div><div class="item-body">' + esc(d.description) + '</div><div class="item-meta">ID: ' + d.id + ' | ' + esc(d.raw_text) + '</div></div><div class="item-actions"><button class="btn-sm btn-del" onclick="delSchedule(' + d.id + ')">삭제</button></div></div>';
  }).join('');
}

async function delSchedule(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  await adminFetch('/api/admin/schedules/' + safeId(id), { method: 'DELETE' });
  loadSchedules();
}

async function loadUpdateList() {
  const data = await adminFetch('/api/admin/updates');
  if (!data.length) {
    document.getElementById('updateList').innerHTML = '<div class="empty">작성된 업데이트가 없습니다</div>';
    return;
  }
  document.getElementById('updateList').innerHTML = data.map(d =>
    '<div class="item"><div class="item-content"><div class="item-subject">[' + esc(d.category) + '] ' + esc(d.title) + '</div><div class="item-body">' + esc(d.content) + '</div><div class="item-meta">' + new Date(d.created_at).toLocaleString('ko-KR') + '</div></div><div class="item-actions"><button class="btn-sm btn-del" onclick="delUpdate(' + d.id + ')">삭제</button></div></div>'
  ).join('');
}

async function addUpdate() {
  const category = document.getElementById('updateCategory').value;
  const title = document.getElementById('updateTitle').value.trim();
  const content = document.getElementById('updateContent').value.trim();
  if (!title || !content) { alert('제목과 내용을 입력하세요'); return; }
  await adminFetch('/api/admin/updates', { method: 'POST', body: { title, content, category } });
  document.getElementById('updateTitle').value = '';
  document.getElementById('updateContent').value = '';
  loadUpdateList();
}

async function delUpdate(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  await adminFetch('/api/admin/updates/' + safeId(id), { method: 'DELETE' });
  loadUpdateList();
}

async function addSchedule() {
  const bj = document.getElementById('addBj').value.trim();
  const date = document.getElementById('addDate').value;
  const time = document.getElementById('addTime').value;
  const desc = document.getElementById('addDesc').value.trim();
  if (!bj || !date || !time) { alert('스트리머 이름, 날짜, 시간을 입력하세요'); return; }
  const start = date + 'T' + time + ':00+09:00';
  await adminFetch('/api/admin/schedules', { method: 'POST', body: { bj_name: bj, broadcast_start: start, description: desc } });
  document.getElementById('addBj').value = '';
  document.getElementById('addDesc').value = '';
  loadSchedules();
}

const communityReasonLabels = {
  profanity: '비속어·혐오',
  spam: '도배·광고',
  personal_info: '개인정보',
  other: '기타',
};

async function loadCommunityReports() {
  const status = document.getElementById('communityReportStatus').value;
  const list = document.getElementById('communityReportList');
  list.innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    const data = await adminFetch('/api/community/moderation/reports?status=' + encodeURIComponent(status));
    renderCommunityReports(Array.isArray(data.items) ? data.items : []);
  } catch (error) {
    list.innerHTML = '<div class="empty">' + esc(error.message) + '</div>';
  }
}

function renderCommunityReports(items) {
  const list = document.getElementById('communityReportList');
  if (!items.length) {
    list.innerHTML = '<div class="empty">해당 신고가 없습니다</div>';
    return;
  }
  list.innerHTML = items.map(function(report) {
    const reportId = safeId(report.id);
    const targetId = safeId(report.targetId);
    const targetType = report.targetType === 'comment' ? 'comment' : 'post';
    if (!reportId || !targetId) return '';
    const target = report.target || {};
    const title = target.title ? target.title : (targetType === 'post' ? '게시글' : '댓글');
    const body = target.body || target.excerpt || '대상 내용을 확인할 수 없습니다.';
    const postMeta = target.postId ? ' · 게시글 #' + safeId(target.postId) : '';
    return '<div class="item"><div class="item-content">'
      + '<div class="item-subject">[' + esc(communityReasonLabels[report.reason] || report.reason) + '] '
      + esc(title) + ' #' + targetId + '</div>'
      + '<div class="item-body">' + esc(body) + '</div>'
      + (report.detail ? '<div class="item-body"><strong>신고 내용:</strong> ' + esc(report.detail) + '</div>' : '')
      + '<div class="item-meta">신고 #' + reportId + postMeta + ' · ' + esc(new Date(report.createdAt).toLocaleString('ko-KR')) + '</div>'
      + '</div><div class="item-actions">'
      + '<button class="btn-sm btn-hide" onclick="moderateCommunityTarget(\'' + targetType + '\',' + targetId + ',\'hide\')">숨김</button>'
      + '<button class="btn-sm btn-restore" onclick="moderateCommunityTarget(\'' + targetType + '\',' + targetId + ',\'restore\')">복구</button>'
      + '<button class="btn-sm btn-del" onclick="moderateCommunityTarget(\'' + targetType + '\',' + targetId + ',\'delete\')">삭제</button>'
      + '<button class="btn-sm btn-edit" onclick="updateCommunityReport(' + reportId + ',\'resolved\')">완료</button>'
      + '<button class="btn-sm" onclick="updateCommunityReport(' + reportId + ',\'dismissed\')">기각</button>'
      + '</div></div>';
  }).join('');
}

async function moderateCommunityTarget(targetType, targetId, action) {
  if (!confirm('대상을 ' + ({ hide: '숨김', restore: '복구', delete: '삭제' }[action] || action) + ' 처리할까요?')) return;
  try {
    await adminFetch('/api/community/moderation/' + targetType + '/' + targetId, {
      method: 'PATCH',
      body: { action },
    });
    loadCommunityReports();
  } catch (error) { alert(error.message); }
}

async function updateCommunityReport(reportId, status) {
  try {
    await adminFetch('/api/community/moderation/reports/' + reportId, {
      method: 'PATCH',
      body: { status },
    });
    loadCommunityReports();
  } catch (error) { alert(error.message); }
}
</script>
</body>
</html>
